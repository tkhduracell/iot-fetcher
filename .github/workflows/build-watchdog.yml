name: Build and Test watchdog

on:
  push:
    branches:
      - main
    paths:
      - 'watchdog/**'
      - '.github/workflows/build-watchdog.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'watchdog/**'
      - '.github/workflows/build-watchdog.yml'

jobs:
  test-watchdog:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ./watchdog/go.mod
        cache: false

    - name: Go vet
      working-directory: ./watchdog
      run: go vet ./...

    - name: Go test
      working-directory: ./watchdog
      run: go test ./...

  build-watchdog:
    # Native arm64: these images are arm64-only (see #456), so an amd64
    # runner would build them under QEMU. Free for public repos.
    runs-on: ubuntu-24.04-arm
    needs: test-watchdog

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - uses: 'google-github-actions/auth@v3'
      id: auth
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        token_format: access_token
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_ID }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - uses: docker/login-action@v4
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        registry: europe-docker.pkg.dev
        username: oauth2accesstoken
        password: '${{ steps.auth.outputs.access_token }}'

    - name: Build And Push watchdog image
      uses: docker/build-push-action@v7
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        context: ./watchdog/
        platforms: linux/arm64
        push: true
        tags: europe-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/images/watchdog:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build watchdog image
      uses: docker/build-push-action@v7
      if: ${{ !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      with:
        context: ./watchdog/
        platforms: linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
