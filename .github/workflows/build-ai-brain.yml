name: Build and Deploy ai-brain

on:
  push:
    branches:
      - main
    paths:
      - 'ai-brain/**'
      - '.github/workflows/build-ai-brain.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'ai-brain/**'
      - '.github/workflows/build-ai-brain.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: ai-brain/uv.lock

    - name: Install dependencies
      working-directory: ai-brain
      run: uv sync --frozen

    - name: Run tests
      working-directory: ai-brain
      run: uv run pytest -q

  build:
    needs: test

    # Native arm64: these images are arm64-only (see #456), so an amd64
    # runner would build them under QEMU. Free for public repos.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - uses: 'google-github-actions/auth@v3'
      id: auth
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        token_format: access_token
        project_id: ${{secrets.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_ID }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - uses: docker/login-action@v4
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        registry: europe-docker.pkg.dev
        username: oauth2accesstoken
        password: '${{ steps.auth.outputs.access_token }}'

    - name: Build And Push Docker image
      uses: docker/build-push-action@v7
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      with:
        context: ./ai-brain/
        platforms: linux/arm64
        push: true
        tags: europe-docker.pkg.dev/${{secrets.GCP_PROJECT_ID }}/images/ai-brain:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Docker image
      uses: docker/build-push-action@v7
      if: ${{ !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      with:
        context: ./ai-brain/
        platforms: linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
