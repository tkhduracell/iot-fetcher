[project]
name = "ai-brain"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "slack-bolt==1.23.0",
    "aiohttp==3.11.18",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "respx==0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
