version: "2.4"

volumes:
  victoria-metrics:
  garmin-tokens:
  home-assistant-config:
  caddy-data:
  gdrive-rag-data:
  ai-brain-memory:
  ollama-models:

services:
  database:
    image: victoriametrics/victoria-metrics:latest
    hostname: database
    restart: unless-stopped
    # No ports exposed - only accessible via database-auth (vmauth) for security
    volumes:
      - victoria-metrics:/victoria-metrics-data
      - ./victoria-metrics/vmscrape.yml:/etc/vmscrape.yml:ro
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=3y
      - -httpListenAddr=:8181
      - -dedup.minScrapeInterval=10s
      - -promscrape.config=/etc/vmscrape.yml

  database-auth:
    image: victoriametrics/vmauth:latest
    hostname: database-auth
    restart: unless-stopped
    ports:
      - "8427:8427"
    environment:
      - VMAUTH_CONFIG
    command:
      - sh
      - -c
      - 'echo "$$VMAUTH_CONFIG" > /etc/auth.yml && exec vmauth -auth.config=/etc/auth.yml'
    depends_on:
      - database

  https-proxy:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/https-proxy:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
    depends_on:
      - iot-fetcher
      - database-auth
      - ai-assistant
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  ai-assistant:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/ai-assistant:latest
    hostname: ai-assistant
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      - database-auth
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  iot-fetcher:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/iot-fetcher:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - database-auth
      - sonos-http-api
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  pool-pump-planner:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/pool-pump-planner:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
    depends_on:
      - database-auth
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  sigenergy-bridge:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/sigenergy-bridge:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - database-auth
      - home-assistant
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  gdrive-rag:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/gdrive-rag:latest
    hostname: gdrive-rag
    restart: unless-stopped
    volumes:
      - gdrive-rag-data:/data
    depends_on:
      - ollama
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  ai-brain:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/ai-brain:latest
    hostname: ai-brain
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - ai-brain-memory:/memory
    depends_on:
      - database-auth
      - gdrive-rag
      - sonos-http-api
      - docker-proxy
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  # Read-only-ish view of the Docker API for ai-brain's docker_ps/docker_top/
  # docker_logs tools, so ai-brain itself never mounts docker.sock. Only
  # CONTAINERS/LOGS/TOP/RESTARTS are granted -- ARCHIVE and EXPORT stay off,
  # since those two let a caller pull a container's whole filesystem rather
  # than just its state, and nothing here needs that. RESTARTS works even
  # though POST=0, and is only ever reached through a human-approved
  # docker_restart proposal (see ai_brain.approvals), never called directly.
  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    hostname: docker-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    environment:
      - CONTAINERS=1
      - ALLOW_LOGS=1
      - ALLOW_TOP=1
      - ALLOW_RESTARTS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    restart: unless-stopped
    # Serves gdrive-rag's embeddings (RAG_EMBED_PROVIDER=ollama,
    # qwen3-embedding:0.6b) so indexing has no cloud quota. ai-brain does not
    # use it: a chat model on the Pi's CPU mostly timed out (ai-brain/README.md).
    environment:
      # Server fallback for clients that don't send options.num_ctx; gdrive-rag
      # sends its own (4096) per request.
      - OLLAMA_CONTEXT_LENGTH=16384
    volumes:
      - ollama-models:/root/.ollama
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  tibber-influx-bridge:
    image: tkhduracell/tibber-influxdb-bridge:latest
    restart: unless-stopped
    depends_on:
      - https-proxy
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  garmin-influx-bridge:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/garmin-fetch:latest
    restart: unless-stopped
    volumes:
      - garmin-tokens:/home/appuser/.garminconnect
    depends_on:
      - https-proxy
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  home-assistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - home-assistant-config:/config
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Stockholm
    healthcheck:
      test: curl -k http://localhost:8123 || exit 1

  sonos-http-api:
    image: ghcr.io/tkhduracell/sonos-http-api:master
    hostname: sonos-http-api
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Stockholm

  watchdog:
    image: europe-docker.pkg.dev/filiplindqvist-com-ea66d/images/watchdog:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/watchdog:/data
    labels:
      - "wud.watch=true"
